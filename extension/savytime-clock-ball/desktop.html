<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SavyTime ball on your desktop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3fc;
        color: #14213d;
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: 340px;
        padding: 24px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(11, 42, 122, 0.18);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: #5b6b8c;
      }
      button {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 12px;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Your ball on the desktop</h1>
      <p id="note">
        Pops the ball out into a small window that stays on top of every app, even outside the
        browser.
      </p>
      <button id="pop" type="button">Pop the ball out</button>
      <p id="open" hidden>
        The ball is out on your desktop. Keep this small pinned tab open: closing it closes the
        ball's window.
      </p>
    </div>
    <script src="shared.js"></script>
    <script src="desktop.js"></script>
  </body>
</html>
