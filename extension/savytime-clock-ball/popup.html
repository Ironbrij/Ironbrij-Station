<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SavyTime Clock Ball</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #14213d;
        background: #fff;
      }
      /* Opened as a full tab on install: centre the card. */
      body.page {
        width: auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3fc;
      }
      body.page .card {
        width: 320px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(11, 42, 122, 0.18);
        background: #fff;
      }
      header {
        padding: 18px 16px 14px;
        text-align: center;
        background: linear-gradient(160deg, #0b2a7a, #1d4ed8);
        color: #fff;
      }
      header h1 {
        margin: 10px 0 2px;
        font-size: 15px;
      }
      header p {
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
      }
      #preview {
        display: flex;
        justify-content: center;
        min-height: 84px;
        align-items: center;
      }
      main {
        padding: 14px 16px 16px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #5b6b8c;
      }
      [hidden] {
        display: none !important;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 12px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #d6deef;
        border-radius: 10px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #1d4ed8;
        outline-offset: -1px;
      }
      .error {
        margin: 0 0 10px;
        color: #c81e1e;
        font-size: 12px;
      }
      .muted {
        margin: 10px 0 0;
        color: #5b6b8c;
        font-size: 12px;
        text-align: center;
      }
      .or {
        margin: 12px 0;
        text-align: center;
        color: #5b6b8c;
        font-size: 12px;
      }
      .swatches,
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .swatches button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
        box-shadow: 0 2px 6px rgba(11, 42, 122, 0.25);
      }
      .swatches button[aria-pressed="true"] {
        border-color: #14213d;
        outline: 2px solid #fff;
        outline-offset: -4px;
      }
      .sizes button {
        flex: 1;
        padding: 6px 0;
        border: 1px solid #d6deef;
        border-radius: 8px;
        background: #f4f7fd;
        color: #14213d;
        font: inherit;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .sizes button[aria-pressed="true"] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .btn {
        display: block;
        box-sizing: border-box;
        width: 100%;
        flex: 1;
        padding: 9px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
      }
      .primary {
        border: 0;
        background: #1d4ed8;
        color: #fff;
      }
      .primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .secondary {
        border: 1px solid #d6deef;
        background: #f4f7fd;
        color: #14213d;
      }
      .account {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e6ecf7;
        font-size: 12px;
        color: #5b6b8c;
      }
      .account strong {
        color: #14213d;
      }
      .link {
        border: 0;
        background: none;
        padding: 0;
        color: #1d4ed8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <div id="preview"></div>
        <h1 id="title">Sign in to start</h1>
        <p id="detail">Use your Ironbrij SavyTime account.</p>
      </header>

      <main id="signin" hidden>
        <form id="form">
          <label>Email <input id="email" type="email" autocomplete="username" required /></label>
          <label
            >Password <input id="password" type="password" autocomplete="current-password" required
          /></label>
          <p class="error" id="error" hidden></p>
          <button class="btn primary" id="submit" type="submit">Sign in</button>
        </form>
        <div class="or">or</div>
        <a class="btn secondary" id="google" target="_blank"
          >Signed in with Google? Connect from SavyTime</a
        >
      </main>

      <main id="signedin" hidden>
        <h2>Ball size</h2>
        <div class="sizes" id="sizes"></div>
        <h2>Ball colour</h2>
        <div class="swatches" id="swatches"></div>
        <div class="row">
          <button class="btn secondary" id="reset" type="button">Reset position</button>
          <a class="btn primary" id="open" target="_blank">Open SavyTime</a>
        </div>
        <p class="muted" id="synced"></p>
        <div class="account">
          <span>Signed in as <strong id="who"></strong></span>
          <button class="link" id="signout" type="button">Sign out</button>
        </div>
      </main>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
