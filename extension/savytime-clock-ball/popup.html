<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SavyTime Clock Ball</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #14213d;
        background: #fff;
      }
      /* Opened as a full tab on install: centre the card. */
      body.page {
        width: auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef3fc;
      }
      body.page .card {
        width: 320px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(11, 42, 122, 0.18);
        background: #fff;
      }
      header {
        padding: 18px 16px 14px;
        text-align: center;
        background: linear-gradient(160deg, #0b2a7a, #1d4ed8);
        color: #fff;
      }
      header h1 {
        margin: 10px 0 2px;
        font-size: 15px;
      }
      header p {
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
      }
      #preview {
        display: flex;
        justify-content: center;
        min-height: 84px;
        align-items: center;
      }
      main {
        padding: 14px 16px 16px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #5b6b8c;
      }
      [hidden] {
        display: none !important;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 12px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #d6deef;
        border-radius: 10px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #1d4ed8;
        outline-offset: -1px;
      }
      .error {
        margin: 0 0 10px;
        color: #c81e1e;
        font-size: 12px;
      }
      .muted {
        margin: 10px 0 0;
        color: #5b6b8c;
        font-size: 12px;
        text-align: center;
      }
      .or {
        margin: 12px 0;
        text-align: center;
        color: #5b6b8c;
        font-size: 12px;
      }
      .swatches,
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .swatches button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
        box-shadow: 0 2px 6px rgba(11, 42, 122, 0.25);
      }
      .swatches button[aria-pressed="true"] {
        border-color: #14213d;
        outline: 2px solid #fff;
        outline-offset: -4px;
      }
      .sizes button {
        flex: 1;
        padding: 6px 0;
        border: 1px solid #d6deef;
        border-radius: 8px;
        background: #f4f7fd;
        color: #14213d;
        font: inherit;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .sizes button[aria-pressed="true"] {
        background: #1d4ed8;
        border-color: #1d4ed8;
        color: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .btn {
        display: block;
        box-sizing: border-box;
        width: 100%;
        flex: 1;
        padding: 9px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
      }
      .primary {
        border: 0;
        background: #1d4ed8;
        color: #fff;
      }
      .primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .secondary {
        border: 1px solid #d6deef;
        background: #f4f7fd;
        color: #14213d;
      }
      .account {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #e6ecf7;
        font-size: 12px;
        color: #5b6b8c;
      }
      .account strong {
        color: #14213d;
      }
      .link {
        border: 0;
        background: none;
        padding: 0;
        color: #1d4ed8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .open {
        margin-bottom: 4px;
      }
      .google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid #d6deef;
        background: #fff;
        color: #14213d;
        box-shadow: 0 1px 3px rgba(11, 42, 122, 0.12);
      }
      .google:hover {
        background: #f4f7fd;
      }
      details {
        margin-top: 12px;
      }
      summary {
        cursor: pointer;
        color: #1d4ed8;
        font-weight: 600;
        font-size: 12px;
        text-align: center;
        list-style: none;
        margin-bottom: 12px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .customise[open] summary {
        color: #5b6b8c;
      }
      #preview {
        padding-top: 22px;
      }
      .hat-row {
        margin-bottom: 10px;
      }
      .upload {
        margin: 0;
        font-size: 12px;
      }
      .toggles {
        display: flex;
        gap: 16px;
        margin-bottom: 12px;
      }
      .toggles label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        cursor: pointer;
      }
      .toggles input {
        width: auto;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <div id="preview"></div>
        <h1 id="title">Sign in to start</h1>
        <p id="detail">Use your Ironbrij SavyTime account.</p>
      </header>

      <main id="signin" hidden>
        <button class="btn google" id="google" type="button">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path
              fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
            />
            <path
              fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
            />
            <path
              fill="#4CAF50"
              d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"
            />
            <path
              fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
            />
          </svg>
          Continue with Google
        </button>
        <p class="muted" id="googleHint" hidden>
          Sign in with Google in the SavyTime panel that just opened. This updates by itself.
        </p>
        <details class="email">
          <summary>Use email and password instead</summary>
          <form id="form">
            <label>Email <input id="email" type="email" autocomplete="username" required /></label>
            <label
              >Password
              <input id="password" type="password" autocomplete="current-password" required
            /></label>
            <p class="error" id="error" hidden></p>
            <button class="btn primary" id="submit" type="submit">Sign in</button>
          </form>
        </details>
      </main>

      <main id="signedin" hidden>
        <button class="btn primary open" id="open" type="button">
          Open SavyTime beside this page
        </button>
        <p class="muted" id="synced"></p>
        <details class="customise">
          <summary>Customise the ball</summary>
          <h2>Face</h2>
          <div class="sizes" id="faces">
            <button type="button" data-face="logo">Ironbrij logo</button>
            <button type="button" data-face="robot">Robot</button>
          </div>
          <h2>Size</h2>
          <div class="sizes" id="sizes"></div>
          <div id="colours">
            <h2>Colour</h2>
            <div class="swatches" id="swatches"></div>
          </div>
          <h2>Hat</h2>
          <div class="row hat-row">
            <label class="btn secondary upload"
              >Upload a PNG <input id="hatFile" type="file" accept="image/png" hidden
            /></label>
            <button class="btn secondary" id="removeHat" type="button">Take it off</button>
          </div>
          <p class="error" id="hatError" hidden></p>
          <div class="toggles">
            <label><input id="blink" type="checkbox" /> Blink</label>
            <label><input id="jokes" type="checkbox" /> Tell jokes</label>
          </div>
          <button class="btn secondary" id="reset" type="button">Put it back in the corner</button>
        </details>
        <div class="account">
          <span>Signed in as <strong id="who"></strong></span>
          <button class="link" id="signout" type="button">Sign out</button>
        </div>
      </main>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
